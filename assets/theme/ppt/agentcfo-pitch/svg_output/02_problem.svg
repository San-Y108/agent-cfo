<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220"/><text x="80" y="92" fill="#F1F5F9" font-size="42" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">痛点：DAO 财务执行链路存在四个核心问题</text><rect x="80" y="150" width="540" height="220" rx="18" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35"/><g data-icon="tabler-outline/table" transform="translate(100,168)" stroke="#22D3EE" fill="none" stroke-width="2"><rect x="2" y="2" width="24" height="24" rx="6"/><path d="M8 14 H20"/><path d="M14 8 V20"/></g><text x="140" y="192" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">人工表格易错</text><text x="100" y="236" fill="#94A3B8" font-size="21" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="400" text-anchor="start">多来源手工录入导致金额与收款方错误</text><rect x="660" y="150" width="540" height="220" rx="18" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35"/><g data-icon="tabler-outline/eye" transform="translate(680,168)" stroke="#22D3EE" fill="none" stroke-width="2"><rect x="2" y="2" width="24" height="24" rx="6"/><path d="M8 14 H20"/><path d="M14 8 V20"/></g><text x="720" y="192" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">支出不透明</text><text x="680" y="236" fill="#94A3B8" font-size="21" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="400" text-anchor="start">决策依据与执行结果分散在不同工具</text><rect x="80" y="400" width="540" height="220" rx="18" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35"/><g data-icon="tabler-outline/signature" transform="translate(100,418)" stroke="#22D3EE" fill="none" stroke-width="2"><rect x="2" y="2" width="24" height="24" rx="6"/><path d="M8 14 H20"/><path d="M14 8 V20"/></g><text x="140" y="442" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="70