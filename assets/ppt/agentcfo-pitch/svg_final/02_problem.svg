<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0B1220" /><text x="80" y="92" fill="#F1F5F9" font-size="42" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">痛点：DAO 财务执行链路存在四个核心问题</text><path fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35" d="M98,150 H602 A18,18 0 0 1 620,168 V352 A18,18 0 0 1 602,370 H98 A18,18 0 0 1 80,352 V168 A18,18 0 0 1 98,150 Z" /><g data-icon="tabler-outline/table" transform="translate(100,168)" stroke="#22D3EE" fill="none" stroke-width="2"><path d="M8,2 H20 A6,6 0 0 1 26,8 V20 A6,6 0 0 1 20,26 H8 A6,6 0 0 1 2,20 V8 A6,6 0 0 1 8,2 Z" /><path d="M8 14 H20" /><path d="M14 8 V20" /></g><text x="140" y="192" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">人工表格易错</text><text x="100" y="236" fill="#94A3B8" font-size="21" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="400" text-anchor="start">多来源手工录入导致金额与收款方错误</text><path fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35" d="M678,150 H1182 A18,18 0 0 1 1200,168 V352 A18,18 0 0 1 1182,370 H678 A18,18 0 0 1 660,352 V168 A18,18 0 0 1 678,150 Z" /><g data-icon="tabler-outline/eye" transform="translate(680,168)" stroke="#22D3EE" fill="none" stroke-width="2"><path d="M8,2 H20 A6,6 0 0 1 26,8 V20 A6,6 0 0 1 20,26 H8 A6,6 0 0 1 2,20 V8 A6,6 0 0 1 8,2 Z" /><path d="M8 14 H20" /><path d="M14 8 V20" /></g><text x="720" y="192" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">支出不透明</text><text x="680" y="236" fill="#94A3B8" font-size="21" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="400" text-anchor="start">决策依据与执行结果分散在不同工具</text><path fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35" d="M98,400 H602 A18,18 0 0 1 620,418 V602 A18,18 0 0 1 602,620 H98 A18,18 0 0 1 80,602 V418 A18,18 0 0 1 98,400 Z" /><g data-icon="tabler-outline/signature" transform="translate(100,418)" stroke="#22D3EE" fill="none" stroke-width="2"><path d="M8,2 H20 A6,6 0 0 1 26,8 V20 A6,6 0 0 1 20,26 H8 A6,6 0 0 1 2,20 V8 A6,6 0 0 1 8,2 Z" /><path d="M8 14 H20" /><path d="M14 8 V20" /></g><text x="140" y="442" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">多签效率低</text><text x="100" y="486" fill="#94A3B8" font-size="21" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="400" text-anchor="start">流程长、签名慢、关键付款经常延迟</text><path fill="#111827" stroke="#8B5CF6" stroke-opacity="0.35" d="M678,400 H1182 A18,18 0 0 1 1200,418 V602 A18,18 0 0 1 1182,620 H678 A18,18 0 0 1 660,602 V418 A18,18 0 0 1 678,400 Z" /><g data-icon="tabler-outline/shield" transform="translate(680,418)" stroke="#22D3EE" fill="none" stroke-width="2"><path d="M8,2 H20 A6,6 0 0 1 26,8 V20 A6,6 0 0 1 20,26 H8 A6,6 0 0 1 2,20 V8 A6,6 0 0 1 8,2 Z" /><path d="M8 14 H20" /><path d="M14 8 V20" /></g><text x="720" y="442" fill="#F1F5F9" font-size="28" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700" text-anchor="start">全自动有风险</text><text x="680" y="486" fill="#94A3B8" font-size="21" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="400" text-anchor="start">缺少风控与人工闸门会放大资金风险</text><text x="1220" y="686" fill="#94A3B8" font-size="20" font-family="Microsoft YaHei, Arial, sans-serif" text-anchor="end">02</text></svg>