<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CAW execution core node icon">
  <title>CAW execution core node icon</title>
  <defs>
    <radialGradient id="cawGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B5FF4D" stop-opacity="0.45"/>
      <stop offset="0.58" stop-color="#B5FF4D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B5FF4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cawAccent" x1="58" y1="58" x2="198" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B5FF4D"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <!-- Ambient glow -->
  <circle cx="128" cy="128" r="118" fill="url(#cawGlow)"/>
  <!-- Inner dark disc -->
  <circle cx="128" cy="128" r="88" fill="#0B0F14" fill-opacity="0.94" stroke="#B5FF4D" stroke-opacity="0.75" stroke-width="2"/>

  <!-- Hexagon chip outline -->
  <path d="M128 66 L170 90 L170 138 L128 162 L86 138 L86 90 Z" fill="none" stroke="url(#cawAccent)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Execution bolt inside the chip -->
  <path d="M142 98 L120 124 L134 124 L124 152 L146 126 L132 126 Z" fill="url(#cawAccent)"/>

  <!-- Vertex connection dots -->
  <circle cx="128" cy="66" r="4.5" fill="#B5FF4D"/>
  <circle cx="170" cy="90" r="4.5" fill="#B5FF4D"/>
  <circle cx="170" cy="138" r="4.5" fill="#B5FF4D"/>
  <circle cx="128" cy="162" r="4.5" fill="#B5FF4D"/>
  <circle cx="86" cy="138" r="4.5" fill="#B5FF4D"/>
  <circle cx="86" cy="90" r="4.5" fill="#B5FF4D"/>
</svg>
